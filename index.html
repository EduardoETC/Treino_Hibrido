<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1a08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atleta Híbrido">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Desafio Atleta Híbrido</title>
<!-- Catálogo e ilustrações embutidos. manifest.json, sw.js e icon.svg
     ficam ao lado deste arquivo apenas para o PWA (instalação e offline);
     o app funciona sem eles. -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#b5f23d; --dark:#0f1a08; --card:#161f0c; --card2:#1c2810;
    --text:#e8f0d8; --muted:#7a9060; --accent:#ff5c2b; --blue:#3de8f2; --warn:#ffb02b;
    --fig:#e8f0d8; --mov:#b5f23d; --eqp:#3de8f2; --flr:#3d4f2a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:78px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  :focus-visible{outline:2px solid var(--green);outline-offset:2px}
  button{font-family:'DM Sans',sans-serif}

  .header{background:linear-gradient(160deg,#162208,#0f1a08 60%);padding:20px 20px 14px;border-bottom:2px solid var(--green)}
  .header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .header h1{font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;color:#fff;letter-spacing:1px}
  .header h1 span{color:var(--green)}
  .plan-switch{background:rgba(181,242,61,.1);border:1.5px solid rgba(181,242,61,.3);color:var(--green);
    font-size:11px;font-weight:700;padding:7px 12px;border-radius:10px;cursor:pointer;flex-shrink:0;
    max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
  .header-sub{font-size:11px;color:var(--muted);margin-top:6px}

  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0d1609;border-top:1px solid rgba(181,242,61,.15);
    display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom)}
  .bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;cursor:pointer;
    border:none;background:none;color:var(--muted);font-size:10px;font-weight:700}
  .bnav-btn .bnav-icon{font-size:19px}
  .bnav-btn.active{color:var(--green)}

  .screen{display:none}.screen.active{display:block}
  .content{padding:18px}

  /* Mobile-first, mas com teto de largura: numa tela larga o conteúdo
     centraliza em vez de esticar por metros de espaço vazio. */
  .header-top,.header-sub,.day-selector-label,.days-grid,.backup-nag{
    max-width:640px;margin-left:auto;margin-right:auto}
  .content{max-width:676px;margin-left:auto;margin-right:auto}
  .bottom-nav{max-width:676px;margin-left:auto;margin-right:auto}
  @media (min-width:700px){
    .bottom-nav{border-left:1px solid rgba(181,242,61,.12);border-right:1px solid rgba(181,242,61,.12);
      border-radius:14px 14px 0 0}
  }

  .backup-nag{background:rgba(255,176,43,.1);border:1px solid rgba(255,176,43,.3);border-radius:12px;
    padding:12px 14px;margin:14px 18px 0;display:flex;align-items:center;gap:11px;font-size:12px;line-height:1.5}
  .backup-nag button{background:var(--warn);color:#2a1c00;border:none;font-size:11px;font-weight:700;
    padding:8px 12px;border-radius:9px;cursor:pointer;flex-shrink:0}

  .day-selector{padding:14px 18px 12px;background:var(--dark);position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(181,242,61,.1)}
  .day-selector-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);
    margin-bottom:9px;display:flex;justify-content:space-between;gap:8px}
  .day-selector-label .hint{color:var(--green);letter-spacing:.3px;text-transform:none}
  .days-grid{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
  .days-grid::-webkit-scrollbar{display:none}
  .day-btn{flex:1 0 76px;background:var(--card);border:1.5px solid rgba(61,232,242,.2);border-radius:12px;
    padding:9px 5px;text-align:center;cursor:pointer;transition:all .2s}
  .day-btn:active{transform:scale(.95)}
  .day-btn .d-name{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
  .day-btn .d-icon{font-size:17px;margin:3px 0;display:block}
  .day-btn .d-type{font-size:8px;font-weight:700;color:var(--blue);line-height:1.25}
  .day-btn.active{background:rgba(61,232,242,.12);border-color:var(--blue)}
  .day-btn.active .d-name{color:var(--text)}
  .day-btn.next-up::after{content:"•";display:block;color:var(--green);font-size:15px;line-height:6px}

  .day-content{display:none}.day-content.active{display:block}
  .day-hero{border-radius:15px;padding:16px;margin-bottom:14px;display:flex;align-items:center;gap:13px;
    background:linear-gradient(135deg,rgba(61,232,242,.1),rgba(61,232,242,.03));border:1px solid rgba(61,232,242,.2)}
  .hero-icon{font-size:32px;flex-shrink:0}
  .hero-title{font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1;color:#fff;letter-spacing:1px}
  .hero-sub{font-size:12px;color:var(--muted);margin-top:3px}
  .hero-vol{margin-left:auto;text-align:right;flex-shrink:0}
  .hero-vol-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--blue);line-height:1}
  .hero-vol-lbl{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-top:2px}

  .day-alert{background:rgba(255,176,43,.08);border:1px solid rgba(255,176,43,.3);border-left:3px solid var(--warn);
    border-radius:12px;padding:13px 15px;margin-bottom:14px}
  .day-alert-title{font-size:11px;font-weight:700;color:var(--warn);letter-spacing:.5px;margin-bottom:5px}
  .day-alert-text{font-size:12px;line-height:1.55}

  .bloco{background:var(--card);border-radius:14px;margin-bottom:13px;border-left:3px solid var(--blue);overflow:hidden}
  .bloco.t-superset,.bloco.t-triset{border-left-color:var(--accent)}
  .bloco.t-circuito{border-left-color:var(--warn)}
  .bloco.t-tempo{border-left-color:var(--green)}
  .bloco-head{padding:13px 15px 9px;display:flex;align-items:center;gap:10px}
  .bloco-badge{width:29px;height:29px;border-radius:9px;background:rgba(61,232,242,.15);color:var(--blue);
    font-family:'Bebas Neue',sans-serif;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .bloco.t-superset .bloco-badge,.bloco.t-triset .bloco-badge{background:rgba(255,92,43,.15);color:var(--accent)}
  .bloco.t-circuito .bloco-badge{background:rgba(255,176,43,.15);color:var(--warn)}
  .bloco.t-tempo .bloco-badge{background:rgba(181,242,61,.15);color:var(--green)}
  .bloco-label{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
  .bloco-sub{font-size:12px;font-weight:600;margin-top:1px}

  .ex-row{padding:11px 15px;border-top:1px solid rgba(255,255,255,.05)}
  .ex-top{display:flex;align-items:flex-start;gap:11px}
  .ex-fig{width:44px;height:44px;flex-shrink:0;background:rgba(255,255,255,.03);border-radius:10px;padding:2px}
  .ex-fig svg{width:100%;height:100%;display:block}
  .ex-main{flex:1;min-width:0}
  .ex-nome{font-weight:700;font-size:14px;line-height:1.35}
  .ex-pat{font-size:10px;color:var(--muted);margin-top:2px}
  .ex-load{font-family:'Bebas Neue',sans-serif;font-size:21px;color:var(--blue);line-height:1;flex-shrink:0;text-align:right}
  .ex-load small{display:block;font-family:'DM Sans',sans-serif;font-size:9px;font-weight:700;color:var(--muted);
    text-transform:uppercase;margin-top:2px}
  .ex-load.undef{color:var(--warn);font-size:14px}
  .ex-meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0 55px}
  .ex-note{margin:7px 0 0 55px;font-size:11px;color:var(--muted);line-height:1.5}
  .ex-note.is-warn{color:var(--warn);background:rgba(255,176,43,.07);border-left:2px solid rgba(255,176,43,.4);
    padding:7px 10px;border-radius:0 8px 8px 0}

  .nobreak{display:flex;align-items:center;gap:8px;padding:2px 15px 2px 55px}
  .nobreak-bar{flex:1;height:1px;background:rgba(255,92,43,.22)}
  .nobreak-lbl{font-size:9px;color:var(--accent);font-weight:700;letter-spacing:1px;white-space:nowrap}

  .bloco-rest{padding:11px 15px 13px;border-top:1px solid rgba(255,255,255,.05);background:rgba(61,232,242,.03)}
  .bloco-rest-lbl{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .rest-btns{display:flex;gap:8px;flex-wrap:wrap}
  .rest-btn{background:rgba(61,232,242,.08);border:1.5px solid rgba(61,232,242,.2);color:var(--blue);
    font-size:12px;font-weight:700;padding:9px 14px;border-radius:10px;cursor:pointer}
  .rest-btn:disabled{opacity:.45}
  .rest-cd{display:none;font-family:'Bebas Neue',sans-serif;font-size:38px;color:var(--blue);text-align:center;padding:2px 0 9px}
  .rest-cd.active{display:block}
  .rest-cd.done{color:var(--green)}

  .tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px}
  .tag.green{background:rgba(181,242,61,.15);color:var(--green)}
  .tag.blue{background:rgba(61,232,242,.12);color:var(--blue)}
  .tag.orange{background:rgba(255,92,43,.15);color:var(--accent)}
  .tag.warn{background:rgba(255,176,43,.15);color:var(--warn)}
  .tag.gray{background:rgba(255,255,255,.07);color:var(--muted)}

  .block{background:var(--card);border-radius:14px;padding:15px;margin-bottom:12px;border-left:3px solid var(--green)}
  .block-label{font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .block-title{font-weight:700;font-size:15px;line-height:1.4;margin-bottom:9px}

  .btn{border:none;border-radius:11px;font-size:13px;font-weight:700;padding:12px 16px;cursor:pointer}
  .btn-primary{background:var(--green);color:var(--dark)}
  .btn-ghost{background:rgba(181,242,61,.1);border:1.5px solid rgba(181,242,61,.3);color:var(--green)}
  .btn-blue{background:rgba(61,232,242,.1);border:1.5px solid rgba(61,232,242,.3);color:var(--blue)}
  .btn-danger{background:rgba(255,92,43,.1);border:1.5px solid rgba(255,92,43,.3);color:var(--accent)}
  .btn-full{width:100%;margin-top:8px}
  .btn:active{opacity:.75}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap}

  .sec-title{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--green);letter-spacing:1px}
  .sec-sub{font-size:13px;color:var(--muted);margin:3px 0 18px}

  .month-bar{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
  .month-bar::-webkit-scrollbar{display:none}
  .month-btn{flex-shrink:0;background:var(--card);border:1.5px solid transparent;color:var(--muted);
    font-size:12px;font-weight:700;padding:7px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
  .month-btn.active{background:rgba(181,242,61,.12);border-color:var(--green);color:var(--green)}
  .add-month{flex-shrink:0;background:rgba(181,242,61,.08);border:1.5px dashed rgba(181,242,61,.3);color:var(--green);
    font-size:18px;width:36px;height:36px;border-radius:10px;cursor:pointer}

  .cat-tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
  .cat-tabs::-webkit-scrollbar{display:none}
  .cat-tab{flex-shrink:0;background:var(--card);border:1.5px solid transparent;color:var(--muted);
    font-size:12px;font-weight:700;padding:7px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
  .cat-tab.active{border-color:var(--blue);color:var(--blue);background:rgba(61,232,242,.08)}
  .cat-content{display:none}.cat-content.active{display:block}

  .vol-card{background:rgba(61,232,242,.05);border:1px solid rgba(61,232,242,.15);border-radius:12px;
    padding:12px 15px;margin-bottom:13px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .vol-lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
  .vol-val{font-family:'Bebas Neue',sans-serif;font-size:25px;color:var(--blue);line-height:1}

  .entry{background:var(--card);border-radius:13px;margin-bottom:9px;overflow:hidden;border:1px solid rgba(255,255,255,.04)}
  .entry.has-warn{border-color:rgba(255,176,43,.25)}
  .entry-head{padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
  .entry-name{font-weight:700;font-size:14px;line-height:1.35}
  .entry-pill{display:inline-block;font-size:9px;font-weight:700;color:var(--blue);background:rgba(61,232,242,.12);
    padding:1px 6px;border-radius:4px;margin-right:6px;vertical-align:1px}
  .entry-cur{font-size:12px;color:var(--muted);margin-top:3px}
  .entry-cur span{color:var(--blue);font-weight:700}
  .chev{color:var(--muted);font-size:15px;transition:transform .3s;flex-shrink:0}
  .entry.open .chev{transform:rotate(180deg)}
  .entry-body{display:none;padding:0 15px 15px}
  .entry.open .entry-body{display:block}

  .in-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:11px}
  .in-group{flex:1;min-width:0}
  .in-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .in-field{width:100%;background:var(--card2);border:1.5px solid rgba(255,255,255,.08);color:var(--text);
    font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;padding:10px 12px;border-radius:10px;outline:none}
  .in-field:focus{border-color:rgba(61,232,242,.4)}
  textarea.in-field{font-weight:400;font-size:13px;resize:vertical;min-height:70px;line-height:1.5}
  select.in-field{appearance:none}

  .hist-lbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .hist-list{display:flex;flex-direction:column;gap:6px}
  .hist-item{background:var(--card2);border-radius:10px;padding:10px 12px;display:flex;align-items:center;
    justify-content:space-between;gap:8px}
  .hist-month{font-size:11px;font-weight:700;color:var(--muted)}
  .hist-vol{font-size:10px;color:var(--muted);margin-top:2px}
  .hist-val{font-family:'Bebas Neue',sans-serif;font-size:19px;color:var(--blue)}
  .hist-diff{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
  .hist-diff.up{background:rgba(181,242,61,.15);color:var(--green)}
  .hist-diff.down{background:rgba(255,92,43,.12);color:var(--accent)}
  .hist-diff.same{background:rgba(255,255,255,.06);color:var(--muted)}
  .empty{font-size:13px;color:var(--muted);font-style:italic;padding:8px 0}

  .plan-item{background:var(--card);border-radius:13px;padding:15px;margin-bottom:10px;border:1.5px solid transparent}
  .plan-item.active{border-color:var(--green);background:rgba(181,242,61,.05)}
  .plan-item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
  .plan-nome{font-weight:700;font-size:15px}
  .plan-meta{font-size:11px;color:var(--muted);margin-top:3px}
  .plan-mark{font-size:10px;font-weight:700;color:var(--green);background:rgba(181,242,61,.12);
    padding:3px 8px;border-radius:6px;flex-shrink:0}

  .ed-day{background:var(--card);border-radius:13px;margin-bottom:11px;overflow:hidden;border:1px solid rgba(255,255,255,.05)}
  .ed-day-head{padding:13px 15px;display:flex;align-items:center;gap:10px;cursor:pointer}
  .ed-day-name{flex:1;font-weight:700;font-size:14px}
  .ed-day-body{display:none;padding:0 15px 15px}
  .ed-day.open .ed-day-body{display:block}
  .ed-bloco{background:var(--card2);border-radius:11px;padding:12px;margin-bottom:9px}
  .ed-bloco-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .ed-tipo{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent);flex:1}
  .ed-ex{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid rgba(255,255,255,.05);font-size:13px}
  .ed-ex-nome{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ed-ex-det{font-size:11px;color:var(--muted);flex-shrink:0}
  .icon-btn{background:rgba(255,255,255,.05);border:none;color:var(--muted);font-size:13px;
    width:28px;height:28px;border-radius:8px;cursor:pointer;flex-shrink:0}
  .icon-btn.danger{color:var(--accent)}

  .search-res{max-height:46vh;overflow-y:auto;margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .sr-item{background:var(--card2);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer}
  .sr-item:active{background:rgba(61,232,242,.1)}
  .sr-fig{width:34px;height:34px;flex-shrink:0;opacity:.85}
  .sr-fig svg{width:100%;height:100%;display:block}
  .sr-main{flex:1;min-width:0}
  .sr-nome{font-size:13px;font-weight:600;line-height:1.3}
  .sr-meta{font-size:10px;color:var(--muted);margin-top:2px}

  .rule-card{background:var(--card);border-radius:13px;padding:15px;margin-bottom:11px;border-left:3px solid var(--green)}
  .rule-card.is-warn{border-left-color:var(--warn)}
  .rule-title{font-weight:700;font-size:14px;margin-bottom:9px}
  .rule-list{list-style:none;display:flex;flex-direction:column;gap:8px}
  .rule-list li{font-size:13px;line-height:1.55;padding-left:15px;position:relative}
  .rule-list li::before{content:"—";position:absolute;left:0;color:var(--green)}
  .rule-card.is-warn .rule-list li::before{color:var(--warn)}
  .evi-item{padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .evi-item:last-child{border-bottom:none}
  .evi-topic{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:4px;line-height:1.4}
  .evi-text{font-size:12px;color:var(--muted);line-height:1.6}
  .fineprint{font-size:11px;color:var(--muted);line-height:1.6;background:rgba(255,255,255,.03);
    border-radius:12px;padding:13px 15px;margin-top:12px}
  .fineprint a{color:var(--blue)}

  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:300;display:none;
    align-items:flex-end;justify-content:center}
  .sheet-overlay.open{display:flex}
  .sheet{background:#1a2410;border-radius:20px 20px 0 0;padding:20px 18px calc(28px + env(safe-area-inset-bottom));
    width:100%;max-width:520px;max-height:88vh;overflow-y:auto}
  .sheet-title{font-family:'Bebas Neue',sans-serif;font-size:21px;color:var(--green);letter-spacing:1px;margin-bottom:13px}
  .sheet-btns{display:flex;gap:9px;margin-top:13px}
  .sheet-btns .btn{flex:1}

  .toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--green);color:var(--dark);
    font-weight:700;font-size:13px;padding:10px 18px;border-radius:20px;z-index:400;opacity:0;
    transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  .toast.err{background:var(--accent);color:#fff}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>DESAFIO <span>ATLETA</span></h1>
    <button class="plan-switch" id="planSwitch" onclick="showScreen('planos',document.querySelectorAll('.bnav-btn')[2])">—</button>
  </div>
  <div class="header-sub" id="headerSub"></div>
</div>

<div id="backupNag"></div>

<!-- TREINO -->
<div id="screen-treino" class="screen active">
  <div class="day-selector">
    <div class="day-selector-label"><span>Qual treino é hoje?</span><span class="hint" id="nextHint"></span></div>
    <div class="days-grid" id="daysGrid"></div>
  </div>
  <div class="content" id="dayContents"></div>
</div>

<script>
"use strict";
/* ============================================================

   store = {
     v: 3,
     activePlan: <planId>,
     plans:   { [planId]: Plano },
     records: { [planId]: { [exUid]: [ {month,kg,reps} ] } },
     months:  { [planId]: [ "Ago/26", ... ] },
     lastDone:{ [planId]: <diaId> },
     lastBackup: <timestamp|null>
   }

   Plano = { id, nome, autor, criadoEm, dias:[Dia] }
   Dia   = { id, nome, foco, icon, alerta, blocos:[Bloco] }
   Bloco = { id, tipo, descanso, voltas, ex:[Ex] }

   Ex    = { uid, nome, catId, padrao, series, reps, tempo,
             carga, nota, alerta }

   REGRA CENTRAL: o código de compartilhamento carrega SOMENTE
   o Plano. records/months/lastDone nunca atravessam. Isso
   impede que um plano reenviado apague o log de quem treina.
   ============================================================ */

const KEY = 'atleta_hibrido_v3';
const TIPOS = {
  direta:   { nome:'Série direta',  desc:'Um exercício, descanso entre séries' },

  triset:   { nome:'Tri-set',       desc:'Três exercícios sem descanso entre eles' },
  circuito: { nome:'Circuito',      desc:'Vários exercícios em sequência, por voltas' },
  tempo:    { nome:'Por tempo',     desc:'Duração em vez de repetições' }
};
const REST_OPTS = [60, 90, 120, 180];

let store = {};
let currentDay = null;
let currentMonth = null;
let edPlanId = null;

/* ---------- utilidades ---------- */
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSec = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const nf = n => Number(n).toLocaleString('pt-BR');

function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(t._id);
  t._id = setTimeout(() => t.className = 'toast', 2800);
}

/* ---------- persistência ---------- */
function load() {
  try { store = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) { store = {}; }
  store.v = 3;
  store.plans    ||= {};
  store.records  ||= {};
  store.months   ||= {};
  store.lastDone ||= {};
  if (!('lastBackup' in store)) store.lastBackup = null;
  if (!Object.keys(store.plans).length) seedPlanoEduardo();
  if (!store.activePlan || !store.plans[store.activePlan]) store.activePlan = Object.keys(store.plans)[0];
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(store)); return true; }
  catch(e) { toast('Falha ao salvar — armazenamento cheio?', true); return false; }
}
async function pedirPersistencia() {
  try {
    if (!navigator.storage || !navigator.storage.persist) return;
    if (await navigator.storage.persisted()) return;
    await navigator.storage.persist();
  } catch(e) {}
}

const plano   = () => store.plans[store.activePlan];
const recs    = () => (store.records[store.activePlan] ||= {});
const meses   = () => (store.months[store.activePlan]  ||= []);

/* ---------- cálculos ---------- */
const todosEx = p => p.dias.flatMap(d => d.blocos.flatMap(b => b.ex.map(e => ({...e, diaId:d.id, tipo:b.tipo}))));
const exDoDia = d => d.blocos.flatMap(b => b.ex);

function cargaAtual(e) {
  const h = recs()[e.uid];
  return (h && h.length) ? h[h.length-1].kg : e.carga;
}
function repsAtual(e) {
  const h = recs()[e.uid];
  return (h && h.length) ? h[h.length-1].reps : e.reps;
}
function volumeEx(e) {
  const kg = cargaAtual(e);
  if (kg == null || !e.series || !repsAtual(e)) return 0;
  return kg * e.series * repsAtual(e);
}
const volumeDia = d => exDoDia(d).reduce((s,e) => s + volumeEx(e), 0);

function proximoDia() {
  const p = plano();
  if (!p || !p.dias.length) return null;
  const last = store.lastDone[p.id];
  const i = p.dias.findIndex(d => d.id === last);
  return i === -1 ? p.dias[0].id : p.dias[(i+1) % p.dias.length].id;
}

function buildDia(d) {
  const vol = volumeDia(d);
  let h = `<div class="day-hero"><div class="hero-icon">${d.icon||'🏋️'}</div>
    <div><div class="hero-title">${esc(d.nome)}</div>
    <div class="hero-sub">${esc(d.foco||'')} · ${d.blocos.length} ${d.blocos.length===1?'bloco':'blocos'}</div></div>
    ${vol ? `<div class="hero-vol"><div class="hero-vol-val">${nf(vol)}</div><div class="hero-vol-lbl">volume kg</div></div>` : ''}
    </div>`;

  if (d.alerta) h += `<div class="day-alert"><div class="day-alert-title">⚠️ ATENÇÃO</div>
    <div class="day-alert-text">${esc(d.alerta)}</div></div>`;

  d.blocos.forEach((b, i) => {
    const t = TIPOS[b.tipo] || TIPOS.direta;
    const semDescanso = b.tipo==='superset' || b.tipo==='triset' || b.tipo==='circuito';
    h += `<div class="bloco t-${b.tipo}">
      <div class="bloco-head"><div class="bloco-badge">${i+1}</div>
        <div><div class="bloco-label">${esc(t.nome)}${b.tipo==='circuito'&&b.voltas?` · ${b.voltas} voltas`:''}</div>
        <div class="bloco-sub">${esc(t.desc)}</div></div></div>`;
    b.ex.forEach((e, j) => {
      if (j > 0 && semDescanso) h += `<div class="nobreak"><div class="nobreak-bar"></div>
        <div class="nobreak-lbl">SEM DESCANSO ↓</div><div class="nobreak-bar"></div></div>`;
      h += buildExRow(e, b);
    });
    h += `<div class="bloco-rest">
      <div class="bloco-rest-lbl">${semDescanso ? 'Descanso depois do bloco completo' : 'Descanso entre séries'}</div>
      <div class="rest-cd"></div><div class="rest-btns">
      ${restOpts(b.descanso).map(s => `<button class="rest-btn" data-rest="${s}">⏱ ${fmtSec(s)}</button>`).join('')}
      </div></div></div>`;
  });

  h += `<button class="btn btn-ghost btn-full" onclick="marcarFeito('${d.id}')">✓ Marcar ${esc(d.nome)} como feito</button>`;
  return h;
}

function restOpts(d) {
  const s = new Set(REST_OPTS);
  if (d) s.add(d);
  return [...s].sort((a,b) => a-b);
}

function buildExRow(e, b) {
  const kg = cargaAtual(e), undef = (kg == null);
  const porTempo = b.tipo === 'tempo' || e.tempo;
  return `<div class="ex-row"><div class="ex-top">
    <div class="ex-fig">${fig(e.padrao)}</div>
    <div class="ex-main"><div class="ex-nome">${esc(e.nome)}</div>
      <div class="ex-pat">${esc(padLabel(e.padrao))}</div></div>
    ${porTempo ? '' : `<div class="ex-load${undef?' undef':''}">${undef?'definir':esc(kg)}
      <small>${undef?'na academia':'kg'}</small></div>`}
    </div>
    <div class="ex-meta">
      ${porTempo
        ? `<span class="tag green">${e.series||1} × ${fmtSec(e.tempo||30)}</span>`
        : `<span class="tag blue">${e.series} × ${repsAtual(e)} reps</span>`}
      ${!porTempo && !undef ? `<span class="tag gray">vol ${nf(volumeEx(e))} kg</span>` : ''}
      ${e.alerta ? '<span class="tag warn">⚠️ amplitude limitada</span>' : ''}
    </div>
    ${e.nota ? `<div class="ex-note${e.alerta?' is-warn':''}">${esc(e.nota)}</div>` : ''}
  </div>`;
}

/* ============================================================
   TIMER DE DESCANSO
   ============================================================ */
let ativo = null;
function beep(f,d,v){try{const c=(beep._c||=new (window.AudioContext||window.webkitAudioContext)());
  if(c.state==='suspended')c.resume();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);
  o.frequency.value=f;g.gain.setValueAtTime(v||.25,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.start();o.stop(c.currentTime+d);}catch(e){}}
const vib = p => { try { navigator.vibrate?.(p); } catch(e){} };

function initRestTimers() {
  document.querySelectorAll('.rest-btn').forEach(btn => {
    const total = +btn.dataset.rest;
    const cd = btn.closest('.bloco-rest').querySelector('.rest-cd');
    btn.innerHTML = `⏱ ${fmtSec(total)}`;
    btn.onclick = () => startRest(total, btn, cd);
  });
}
function pararRest(r) {
  clearInterval(r.id);
  r.cd.classList.remove('active','done');
  r.btn.innerHTML = `⏱ ${fmtSec(r.total)}`;
  r.irmaos.forEach(b => b.disabled = false);
}
function startRest(total, btn, cd) {
  if (ativo && ativo.btn === btn) { pararRest(ativo); ativo = null; return; }
  if (ativo) { pararRest(ativo); ativo = null; }
  const irmaos = [...btn.closest('.rest-btns').querySelectorAll('.rest-btn')];
  let rem = total;
  cd.classList.add('active'); cd.classList.remove('done');
  cd.textContent = fmtSec(rem);
  irmaos.forEach(b => { if (b !== btn) b.disabled = true; });
  btn.innerHTML = `⏹ ${fmtSec(rem)}`;
  beep(660,.15); vib(80);
  const id = setInterval(() => {
    rem--;
    const t = fmtSec(Math.max(rem,0));
    cd.textContent = t; btn.innerHTML = `⏹ ${t}`;
    if (rem>0 && rem<=3) beep(660,.07,.18);
    if (rem <= 0) {
      clearInterval(id);
      cd.textContent = '✓ Vai!'; cd.classList.add('done');
      btn.innerHTML = `⏱ ${fmtSec(total)}`;
      irmaos.forEach(b => b.disabled = false);
      beep(440,.2); setTimeout(()=>beep(330,.3),260); vib([200,100,300]);
      ativo = null;
    }
  }, 1000);
  ativo = { id, btn, cd, total, irmaos };
}

    const c = document.getElementById('entries-'+d.id);
    c.innerHTML = '';

function buildEntry(e, bi, b) {
  const h = recs()[e.uid] || [];
  const cur = h.find(x => x.month === currentMonth);
  const kg = cargaAtual(e), undef = (kg == null);
  const porTempo = b.tipo === 'tempo' || e.tempo;
  const div = document.createElement('div');
  div.className = 'entry' + (e.alerta ? ' has-warn' : '');
  const resumo = porTempo ? `${e.series||1} × ${fmtSec(e.tempo||30)}`
    : cur ? `<span>${cur.kg}kg × ${cur.reps} reps</span> neste mês`
    : undef ? 'carga a definir na academia' : `base: <span>${kg}kg × ${e.reps} reps</span>`;
  div.innerHTML = `
    <div class="entry-head"><div>
      <div class="entry-name"><span class="entry-pill">B${bi}</span>${esc(e.nome)}</div>
      <div class="entry-cur">${resumo}</div></div><div class="chev">▾</div></div>
    <div class="entry-body">
      ${e.nota ? `<div style="font-size:11px;line-height:1.5;margin-bottom:11px;${e.alerta?'color:var(--warn)':'color:var(--muted)'}">${esc(e.nota)}</div>`:''}
      ${porTempo ? '<div class="empty">Exercício por tempo — sem registro de carga.</div>' : `
      <div class="in-row">
        <div class="in-group"><div class="in-label">Carga (kg)</div>
          <input class="in-field" data-r="kg" type="number" inputmode="decimal" step="0.5"
                 placeholder="${undef?'0':kg}" value="${cur?cur.kg:''}"></div>
        <div class="in-group"><div class="in-label">Reps</div>
          <input class="in-field" data-r="reps" type="number" inputmode="numeric"
                 placeholder="${e.reps}" value="${cur?cur.reps:''}"></div>
        <button class="btn btn-blue" data-r="save">Salvar</button>
      </div>
      <div class="hist-lbl">Histórico</div>
      <div class="hist-list">${histHTML(e)}</div>`}
    </div>`;
  div.querySelector('.entry-head').onclick = () => div.classList.toggle('open');
  div.querySelector('[data-r="save"]')?.addEventListener('click', () => salvarCarga(e, div));
  return div;
}

function histHTML(e) {
  const h = recs()[e.uid] || [];
  if (!h.length) return '<div class="empty">Nenhum registro ainda.</div>';
  return h.map((x,i) => {
    let d = '';
    if (i > 0) {
      const dif = +(x.kg - h[i-1].kg).toFixed(1);
      d = dif > 0 ? `<div class="hist-diff up">+${dif}kg</div>`
        : dif < 0 ? `<div class="hist-diff down">${dif}kg</div>`
        : `<div class="hist-diff same">= mesmo</div>`;
    }
    return `<div class="hist-item"><div><div class="hist-month">${esc(x.month)}</div>
      <div class="hist-vol">vol ${nf(x.kg * (e.series||1) * x.reps)} kg</div></div>
      <div class="hist-val">${x.kg}kg · ${x.reps}r</div>${d}</div>`;
  }).join('');
}

function salvarCarga(e, div) {
  if (!currentMonth) { toast('Crie ou selecione um mês primeiro.', true); return; }
  const kg = parseFloat(div.querySelector('[data-r="kg"]').value);
  const reps = parseInt(div.querySelector('[data-r="reps"]').value, 10);
  if (!Number.isFinite(kg) || kg < 0)  { toast('Informe a carga em kg.', true); return; }
  if (!Number.isFinite(reps) || reps < 1) { toast('Informe as repetições.', true); return; }
  const arr = (recs()[e.uid] ||= []);
  const i = arr.findIndex(x => x.month === currentMonth);
  const entry = { month: currentMonth, kg, reps };
  if (i >= 0) arr[i] = entry; else arr.push(entry);
  arr.sort((a,b) => meses().indexOf(a.month) - meses().indexOf(b.month));
  save(); renderProgresso(); renderTreino(); renderBackupNag();
  toast('Carga salva: ' + e.nome);
}

function traduzir(q) {
  const t = q.toLowerCase().trim();
  if (!t) return [];
  const termos = new Set([t]);
  for (const [pt, en] of Object.entries(window.DIC_PT || {})) {
    if (pt.includes(t) || t.includes(pt)) termos.add(en.toLowerCase());
  }
  return [...termos];
}

function renderBusca(q) {
  const box = document.getElementById('shRes');
  if (!box) return;
  const termos = traduzir(q);
  let res;
  if (!termos.length) {
    res = window.CATALOG.slice(0, 40);
  } else {
    const score = e => {
      const n = e.n.toLowerCase();
      let s = 0;
      termos.forEach(t => {
        if (n === t) s += 100;
        else if (n.startsWith(t)) s += 50;
        else if (n.includes(t)) s += 25;
        else if ((e.t||'').toLowerCase().includes(t) || (e.q||'').toLowerCase().includes(t)) s += 5;
      });
      return s - n.length * 0.02;
    };
    res = window.CATALOG.map(e => ({e, s:score(e)})).filter(x => x.s > 0)
      .sort((a,b) => b.s - a.s).slice(0, 60).map(x => x.e);
  }
  box.innerHTML = res.length
    ? res.map(e => `<div class="sr-item" onclick="escolherEx('${e.i}')">
        <div class="sr-fig">${fig(e.p)}</div>
        <div class="sr-main"><div class="sr-nome">${esc(e.n)}</div>
        <div class="sr-meta">${esc(e.t)} · ${esc(e.q)} · ${esc(padLabel(e.p))}</div></div></div>`).join('')
    : '<div class="empty">Nada encontrado. Tente outro termo ou crie do zero.</div>';
}

/* ============================================================
   COMPARTILHAR / IMPORTAR / BACKUP
   O código carrega SOMENTE o plano. Histórico nunca viaja.
   ============================================================ */
const b64e = s => btoa(unescape(encodeURIComponent(s)));
const b64d = s => decodeURIComponent(escape(atob(s)));

async function comprimir(txt) {
  if (!('CompressionStream' in window)) return null;
  try {
    const cs = new CompressionStream('gzip');
    const buf = await new Response(
      new Blob([txt]).stream().pipeThrough(cs)).arrayBuffer();
    let bin = ''; new Uint8Array(buf).forEach(b => bin += String.fromCharCode(b));
    return btoa(bin);
  } catch(e) { return null; }
}
async function descomprimir(b64) {
  const bin = atob(b64);
  const arr = Uint8Array.from(bin, c => c.charCodeAt(0));
  const ds = new DecompressionStream('gzip');
  return await new Response(new Blob([arr]).stream().pipeThrough(ds)).text();
}

async function gerarCodigo(obj, prefixo) {
  const json = JSON.stringify(obj);
  const gz = await comprimir(json);
  return gz ? `${prefixo}1:${gz}` : `${prefixo}0:${b64e(json)}`;
}
async function lerCodigo(code, prefixo) {
  const t = code.trim().replace(/\s+/g, '');
  const m = t.match(new RegExp(`^${prefixo}([01]):(.+)$`));
  if (!m) throw new Error('formato');
  const json = m[1] === '1' ? await descomprimir(m[2]) : b64d(m[2]);
  return JSON.parse(json);
}

async function importarPlano() {
  const code = document.getElementById('impCode').value;
  if (!code.trim()) { toast('Cole o código primeiro.', true); return; }
  let d;
  try { d = await lerCodigo(code, 'ATL'); }
  catch(e) { toast('Código inválido ou incompleto.', true); return; }
  if (!d || d.t !== 'plano' || !d.p || !Array.isArray(d.p.dias)) { toast('Esse código não é um plano.', true); return; }
  const p = d.p;
  p.id = uid(); p.criadoEm = Date.now();
  // uids novos: evita colidir histórico com um plano já existente
  p.dias.forEach(dia => { dia.id = uid(); (dia.blocos||[]).forEach(b => { b.id = uid(); (b.ex||[]).forEach(e => e.uid = uid()); }); });
  if (Object.values(store.plans).some(x => x.nome === p.nome)) p.nome += ' (importado)';
  store.plans[p.id] = p;
  save(); fecharSheet(); renderPlanos(); renderHeader();
  toast(`Plano importado: ${p.nome}`);
}

async function restaurar() {
  const code = document.getElementById('rsCode').value;
  let d;
  try { d = await lerCodigo(code, 'BKP'); }
  catch(e) { toast('Código de backup inválido.', true); return; }
  if (!d || d.t !== 'backup' || !d.s || !d.s.plans) { toast('Esse código não é um backup.', true); return; }
  store = d.s; store.v = 3;
  if (!store.activePlan || !store.plans[store.activePlan]) store.activePlan = Object.keys(store.plans)[0];
  currentDay = null; currentMonth = null;
  save(); fecharSheet(); renderTudo();
  toast('Backup restaurado');
}

const EVIDENCIA = [

 ['Cadeira extensora (cadeia aberta) e condromalácia','Estresse patelofemoral em cadeia aberta é maior perto da extensão total (~0–45°). Treinar em amplitude parcial (~90° a ~45°) é mais seguro. Escamilla 1998; Steinkamp et al. 1993.'],
 ['Leg press e agachamento (cadeia fechada) e condromalácia','Estresse patelofemoral em cadeia fechada é maior na flexão profunda. Amplitude rasa (~0–45/50°) reduz a carga articular. Escamilla 1998; Steinkamp et al. 1993.'],

 ['Fortalecimento de quadril','Diretriz clínica (grau de evidência A) recomenda fortalecimento de quadril + joelho combinados como primeira linha — superior a exercício de joelho isolado, para dor patelofemoral. Willy et al. 2019, JOSPT.'],

      <li>Descanse depois de completar o bloco inteiro, não no meio dele.</li>

/* ============================================================
   NAVEGAÇÃO / SHEET
   ============================================================ */
function showScreen(nome, btn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+nome).classList.add('active');
  if (btn) {
    document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  if (nome === 'prog')   renderProgresso();
  if (nome === 'planos') renderPlanos();
  if (nome === 'treino') { renderDaySelector(); renderTreino(); }
  window.scrollTo({ top:0, behavior:'smooth' });
}
function sheet(titulo, html) {
  document.getElementById('sheet').innerHTML = `<div class="sheet-title">${esc(titulo)}</div>${html}`;
  document.getElementById('sheetOverlay').classList.add('open');
}
function fecharSheet() { document.getElementById('sheetOverlay').classList.remove('open'); }

function renderTudo() {
  renderHeader(); renderDaySelector(); renderTreino();
  renderProgresso(); renderPlanos(); renderRegras();
}

/* ============================================================
   INIT
   ============================================================ */
load();
currentDay = proximoDia();
currentMonth = meses()[meses().length-1] || null;
renderTudo();
pedirPersistencia();
avisarAssetsFaltando();

document.getElementById('edNome').addEventListener('change', edSalvaMeta);
document.getElementById('edAutor').addEventListener('change', edSalvaMeta);
document.getElementById('sheetOverlay').addEventListener('click', e => {
  if (e.target.id === 'sheetOverlay') fecharSheet();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
